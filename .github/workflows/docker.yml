# 把代码打成 arm64 镜像，推到 GHCR，供 NAS 直接拉取。
#
# 为什么需要这个：
#   NAS 上只有图形界面（UGOS Pro 的「项目」页面），它只会 `docker pull`，
#   没有 `docker compose build`。所以在 GitHub 上把镜像预先构建好，
#   让 NAS 那边只要「拉一个现成的镜像」就能跑。
#
# 为什么用 ubuntu-24.04-arm 而不是 QEMU：
#   第一版用 ubuntu-latest + QEMU 模拟 arm64，`next build` 跑到一半被
#   `qemu: uncaught target signal 4 (Illegal instruction)` 干掉（SWC 的原生
#   二进制在模拟器里跑不了）。换成 GitHub 原生的 arm64 runner 就没有这问题，
#   而且快得多。私有仓库也给用（2 vCPU）。
name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成构建日期（上海时区，人可读）
        id: meta
        run: echo "build_date=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            WORKBENCH_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}

      # 清掉旧版本，只留最新 2 个。
      # 为什么要它：公开包的存储本身不计费（GitHub 对 public packages 免费），
      # 但每个版本是一份完整快照，堆到 20 个以后翻起来很乱，也不利于万一
      # 以后政策变化。latest 永远跟着最新那次构建，保留最新 2 个则 latest 必在内。
      - name: 清理旧镜像版本（只留最新 2 个）
        # 清理失败不该让整个构建显示红叉：镜像已经推上去了，
        # 只是没删成旧版本而已。真失败了去手动跑 cleanup-images。
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: personal-workbench
          package-type: container
          min-versions-to-keep: 2
          # 用户命名空间（lengbuding1991）下的包，GITHUB_TOKEN 默认删不动，
          # 需要 delete:packages 权限的 PAT。没配 PAT 时这一步会失败，
          # 但不影响镜像本身已经推上去 —— 失败就手动跑 cleanup-images。
          token: ${{ secrets.PACKAGES_PAT || secrets.GITHUB_TOKEN }}
