# 个人工作台 —— Docker Compose（绿联 NAS 用，全自动更新）
#
# 你要做的事只有一件：把这个文件粘进 UGOS Pro 的「项目」页面，点部署。
# 之后本地改完代码 → pnpm push → GitHub Actions 自动构建镜像（约 4 分钟）
# → 这里的 watchtower 每 5 分钟查一次 → 发现新镜像自动拉取并重建容器。
# 你直接刷新网页就是最新版，不用再进绿联点任何按钮。
#
# 数据在 ./data（容器里的 /data），watchtower 重建容器不会碰它。
# 备份在 ./data/backups（每天首开自动 VACUUM INTO 一份，保留 14 份）。

services:
  workbench:
    # GitHub Actions 构建好的 arm64 镜像（公开包，匿名可拉）
    image: ghcr.io/lengbuding1991/personal-workbench:latest
    container_name: workbench
    restart: unless-stopped

    # 只有打了这个标签的容器才归 watchtower 管，
    # 避免它去动 NAS 上别的容器（你的发货库存、qBittorrent 之类）。
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    # 容器内部固定监听 3100，映射到 NAS 的 3100。
    # CF Tunnel 的 Service 填 http://192.168.1.197:3100 或 http://localhost:3100。
    ports:
      - "3100:3100"

    volumes:
      # 数据库 + 每日备份，全在这一个目录里
      - ./data:/data
      # 固定时区：工作台的「今天」「本周」全靠本地时间
      - /etc/localtime:/etc/localtime:ro

    environment:
      TZ: Asia/Shanghai
      # 首启不要灌示例数据，从空库开始
      WORKBENCH_SEED: "0"
      # 保持 0：程序会自己看 cloudflared 传来的 X-Forwarded-Proto 决定要不要 Secure。
      # 强制写 1 的话，你在家里用 http://NAS的IP:3100 就登不进去了
      #（浏览器会丢掉 http 下的 Secure cookie，登录看似成功却一直跳回登录页）。
      WB_SECURE_COOKIE: "0"

    # NAS 8G 还要跑别的服务，给个上限防止失控
    mem_limit: 1500m

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 自动更新：盯着上面的 latest 镜像，digest 一变就拉新的并重建 workbench 容器。
  # 自动更新：盯着 workbench 的 latest 镜像，digest 一变就拉新的并重建容器。
  #
  # 环境变量刻意只留最少的几个 —— 这是绿联官方知识库
  # 《在绿联NAS上搭建Watchtower，自动更新容器》里的写法（support.ugnas.com/detail/article/zh-CN/549）。
  # 之前配了 WATCHTOWER_LOG_FORMAT / WATCHTOWER_TIMEOUT / WATCHTOWER_INCLUDE_RESTARTING
  # 这些自定义项，容器一直「重启中」，精简回官方那套最稳。
  watchtower:
    image: ghcr.io/containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped

    volumes:
      # 挂 docker.sock 它才能操作容器。这是它唯一的权限来源，也是唯一的风险点。
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro

    environment:
      TZ: Asia/Shanghai
      # 关键一行：绿联的 Docker 引擎比较新，已经不再支持 1.40 以下的 API，
      # 而 watchtower 自带的 Docker 客户端默认按 1.25 去连，于是刷屏：
      #   "client version 1.25 is too old. Minimum supported API version is 1.40"
      # 强制声明成 1.40（正好是绿联引擎允许的最低版本）就能连上。
      # 如果哪天这条报 "client version 1.40 is too old"，把它往上调一档（1.41 / 1.43）。
      DOCKER_API_VERSION: "1.40"
      # 更新后删掉旧镜像，否则 76MB × N 很快把系统盘吃满
      WATCHTOWER_CLEANUP: "true"
      # 容器一个个重启，不要同时停
      WATCHTOWER_ROLLING_RESTART: "true"
      # 只更新带 com.centurylinklabs.watchtower.enable=true 标签的容器。
      # 上面 workbench 已经打了这个标签；NAS 上别的容器（相册、下载器之类）
      # 不会被它碰，避免哪天自动升级把别的服务搞挂。
      WATCHTOWER_LABEL_ENABLE: "true"
      # 每 5 分钟查一次（300 秒）。想更快改 120，想省电改 900。
      WATCHTOWER_POLL_INTERVAL: "300"
      # 启动时不要打那条横幅，日志干净点
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
