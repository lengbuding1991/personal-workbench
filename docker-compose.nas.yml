# 个人工作台 —— Docker Compose（绿联 NAS 用）
#
# 更新策略：
#   · watchtower 已拆成独立项目（NAS 上单独的「watchtower」项目），
#     它每 24 小时兜底检查一次，只更新带 enable 标签的容器。
#   · 设置页的「立即更新」按钮 → 调 http://watchtower:8080（走 wt-net 这个网络）。
#
# 数据在 ./data（容器里的 /data），重建容器不会碰它。
# 备份在 ./data/backups（每天首开自动 VACUUM INTO 一份，保留 14 份）。

services:
  workbench:
    # GitHub Actions 构建好的 arm64 镜像（公开包，匿名可拉）
    image: ghcr.io/lengbuding1991/personal-workbench:latest
    container_name: workbench
    restart: unless-stopped

    # 只有打了这个标签的容器才归 watchtower 管，
    # 避免它去动 NAS 上别的容器（你的发货库存、qBittorrent 之类）。
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    # 容器内部固定监听 3100，映射到 NAS 的 3100。
    # CF Tunnel 的 Service 填 http://192.168.1.197:3100 或 http://localhost:3100。
    ports:
      - "3100:3100"

    volumes:
      # 数据库 + 每日备份，全在这一个目录里
      - ./data:/data
      # 固定时区：工作台的「今天」「本周」全靠本地时间
      - /etc/localtime:/etc/localtime:ro

    environment:
      TZ: Asia/Shanghai
      # 首启不要灌示例数据，从空库开始
      WORKBENCH_SEED: "0"
      # 保持 0：程序会自己看 cloudflared 传来的 X-Forwarded-Proto 决定要不要 Secure。
      # 强制写 1 的话，你在家里用 http://NAS的IP:3100 就登不进去了
      #（浏览器会丢掉 http 下的 Secure cookie，登录看似成功却一直跳回登录页）。
      WB_SECURE_COOKIE: "0"
      # 「立即更新」按钮要叫的 watchtower 地址与令牌。
      # watchtower 是独立项目，靠 wt-net 这个网络让 workbench 能解析到它。
      # 令牌两边必须一致，否则点按钮会被 watchtower 拒（401）。
      WATCHTOWER_URL: "http://watchtower:8080"
      WATCHTOWER_TOKEN: "GCoYJ99nBwOldp1TWmAm59ZZTlurLcm4"

    # NAS 8G 还要跑别的服务，给个上限防止失控
    mem_limit: 1500m

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # default = 本项目网络；wtnet = 和 watchtower 通信的中立网络
    networks:
      - default
      - wtnet

networks:
  # 先在「网络」里手动建好 wt-net，watchtower 也接这个网络
  wtnet:
    external: true
    name: wt-net
